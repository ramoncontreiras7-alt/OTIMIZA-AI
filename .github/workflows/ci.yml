name: CI - Otimiza AI

on:
  push:
    branches: [main, develop, master]
  pull_request:
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

env:
  GRADLE_OPTS: -Xmx4096m -Dfile.encoding=UTF-8
  GRADLE_VERSION: 9.0

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses

      - name: Run unit tests (JUnit 5 + MockK 1.14.11)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          add-arguments: test --no-daemon --console=plain

      - name: Build debug APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          add-arguments: assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otimiza-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/test/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: app/build/jacoco/
