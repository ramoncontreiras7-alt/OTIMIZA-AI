# Verificação automática: a cada envio de código, o GitHub compila o projeto,
# roda todos os testes e gera o APK. Se algo quebrar, aparece um X vermelho no commit.
# Quando tudo passa, o APK é publicado em "Releases" com um link fixo para baixar no celular.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Testes do domínio (regras de negócio)
        run: ./gradlew :domain:test --stacktrace

      - name: Testes e compilação do módulo de dados (banco)
        run: ./gradlew :data:testDebugUnitTest :data:assembleDebug --stacktrace

      - name: Gerar o APK otimizado (release com R8)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: otimiza-ai-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Resumo dos testes
        if: always()
        run: |
          python3 - <<'PY' > resumo-testes.md
          import glob, xml.etree.ElementTree as ET
          linhas = ["| Suíte | Testes | Falhas | Pulados |", "|---|---|---|---|"]
          total = falhas = 0
          for f in sorted(glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True)):
              r = ET.parse(f).getroot()
              t = int(r.get("tests")); x = int(r.get("failures")) + int(r.get("errors")); s = int(r.get("skipped"))
              total += t; falhas += x
              linhas.append(f"| {r.get('name').split('.')[-1]} | {t} | {x} | {s} |")
          print(f"**Testes automáticos: {total} executados, {falhas} falha(s).**\n")
          print("\n".join(linhas))
          PY
          cat resumo-testes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o APK (link fixo para o celular)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk otimiza-ai.apk
          gh release delete apk-teste --cleanup-tag --yes || true
          gh release create apk-teste otimiza-ai.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Otimiza AI — versão de teste ${GITHUB_RUN_NUMBER}" \
            --notes "APK de teste gerado automaticamente a partir da branch ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Versão otimizada (release com R8). Baixe o arquivo otimiza-ai.apk no celular Android e instale.

          $(cat resumo-testes.md)"

      - name: Guardar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
